name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            APP_DIR="${{ secrets.SERVER_PATH }}"
            cd "$APP_DIR"

            echo "=== Оновлення коду ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Backend: залежності ==="
            cd "$APP_DIR/demax-rag"
            # Віртуальне оточення зареєстроване в aaPanel → Python Project.
            if [ ! -d .venv ]; then
              python3.12 -m venv .venv
            fi
            ./.venv/bin/pip install -q --upgrade pip
            ./.venv/bin/pip install -q -r requirements.txt

            echo "=== Frontend: збірка ==="
            cd "$APP_DIR/demax-admin"
            export PATH="/www/server/nodejs/v22.22.0/bin:$PATH"
            npm ci
            npm run build

            echo "=== Перезапуск API ==="
            # Сервіс керується systemd (unit demax-rag.service), як і решта
            # Python-сервісів на цьому сервері.
            systemctl restart demax-rag
            sleep 8

            echo "=== Перевірка ==="
            curl -fsS http://127.0.0.1:8100/v1/health || {
              echo "API не відповідає — дивіться /www/wwwlogs/demax-rag.log"
              journalctl -u demax-rag -n 30 --no-pager
              exit 1
            }
            nginx -s reload

            echo "=== Деплой завершено ==="
