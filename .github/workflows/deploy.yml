name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            APP_DIR="${{ secrets.SERVER_PATH }}"
            cd "$APP_DIR"

            echo "=== Оновлення коду ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Backend: залежності ==="
            cd "$APP_DIR/demax-rag"
            # Віртуальне оточення створює aaPanel Python Project Manager.
            # Якщо його немає (перший деплой) — створюємо самі.
            if [ ! -d venv ]; then
              python3.12 -m venv venv
            fi
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            echo "=== Frontend: збірка ==="
            cd "$APP_DIR/demax-admin"
            export PATH="/www/server/nodejs/v22.22.0/bin:$PATH"
            npm ci
            npm run build

            echo "=== Перезапуск Python-проєкту ==="
            # Спершу пробуємо через aaPanel (щоб панель бачила коректний стан),
            # інакше — рестарт процесу напряму.
            if command -v bt >/dev/null 2>&1; then
              bt restart_project demax-rag 2>/dev/null || true
            fi
            pkill -f "uvicorn app.main:app" 2>/dev/null || true
            sleep 2
            cd "$APP_DIR/demax-rag"
            nohup ./venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8100 \
              >> /www/wwwlogs/demax-rag.log 2>&1 &
            sleep 6

            echo "=== Перевірка ==="
            curl -fsS http://127.0.0.1:8100/v1/health || {
              echo "API не відповідає — дивіться /www/wwwlogs/demax-rag.log"
              exit 1
            }

            echo "=== Деплой завершено ==="
