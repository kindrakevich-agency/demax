services:
  db:
    image: pgvector/pgvector:pg16
    container_name: demax-rag-db
    environment:
      POSTGRES_USER: demax
      POSTGRES_PASSWORD: demax
      POSTGRES_DB: demax
    volumes:
      - ragdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demax"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: demax-rag-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://demax:demax@db:5432/demax
      CORS_ORIGINS: http://localhost:5199,http://localhost:5173
    ports:
      - "8100:8100"
    volumes:
      - ragmodels:/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ragdb:
  ragmodels:
